name: Unit Tests

# Backend + workers only for now: the frontend has no unit test suite yet,
# just typecheck+build covered by lint.yml.

on:
    workflow_call:
        inputs:
            PYTHON_VERSION:
                description: Python version used to run backend/workers tests
                required: false
                type: string
                default: "3.12"
    workflow_dispatch:
        inputs:
            PYTHON_VERSION:
                description: Python version used to run backend/workers tests
                required: false
                type: string
                default: "3.12"

jobs:
    unit-tests-backend:
        name: Backend
        runs-on: ubuntu-latest
        permissions:
            contents: read
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: spreadsheet_analyser
                    POSTGRES_PASSWORD: spreadsheet_analyser
                    POSTGRES_DB: spreadsheet_analyser
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U spreadsheet_analyser"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
        env:
            DATABASE_URL: postgresql+asyncpg://spreadsheet_analyser:spreadsheet_analyser@localhost:5432/spreadsheet_analyser
            REDIS_URL: redis://localhost:6379/0
        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - name: Set up uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  python-version: ${{ inputs.PYTHON_VERSION }}
                  enable-cache: true
                  cache-dependency-glob: backend/uv.lock

            - name: Install backend dependencies
              working-directory: backend
              run: uv sync --group dev

            - name: Apply database migrations
              working-directory: backend
              run: uv run alembic upgrade head

            - name: Run tests
              working-directory: backend
              run: uv run pytest --cov=app --cov-report=term-missing

    unit-tests-agent-worker:
        name: Agent worker
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - name: Set up uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  python-version: ${{ inputs.PYTHON_VERSION }}
                  enable-cache: true
                  cache-dependency-glob: agent-worker/uv.lock

            - name: Install agent-worker dependencies
              working-directory: agent-worker
              run: uv sync --group dev

            - name: Run tests
              working-directory: agent-worker
              run: uv run pytest

    unit-tests-analysis-worker:
        name: Analysis worker
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - name: Set up uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  python-version: ${{ inputs.PYTHON_VERSION }}
                  enable-cache: true
                  cache-dependency-glob: analysis-worker/uv.lock

            - name: Install analysis-worker dependencies
              working-directory: analysis-worker
              run: uv sync --group dev

            - name: Run tests
              working-directory: analysis-worker
              run: uv run pytest

    unit-tests-index-worker:
        name: Index worker
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - name: Set up uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  python-version: ${{ inputs.PYTHON_VERSION }}
                  enable-cache: true
                  cache-dependency-glob: index-worker/uv.lock

            - name: Install index-worker dependencies
              working-directory: index-worker
              run: uv sync --group dev

            - name: Run tests
              working-directory: index-worker
              run: uv run pytest
