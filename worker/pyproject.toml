[project]
name = "worker"
version = "0.1.0"
description = "spreadsheet-analyser background worker"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.4.0",
    "redis>=5.2.0",
]

[dependency-groups]
test = [
    "pytest>=8.3.0",
    "ruff>=0.15.0",
]
dev = [{ include-group = "test" }]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
