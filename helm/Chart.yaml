apiVersion: v2
name: spreadsheet-analyser
type: application
version: 0.2.0
appVersion: "0.2.0"
description: A Helm chart to deploy spreadsheet-analyser (frontend, backend, agent worker, analysis worker).
# Floor set by the core APIs the chart renders (autoscaling/v2, policy/v1). The Gateway API
# resources additionally need the gateway.networking.k8s.io CRDs installed in the cluster.
kubeVersion: ">=1.25.0-0"
deprecated: false
annotations: {}
keywords: []
# Optional, all off by default (see the `redis`, `postgres` and `rustfs` keys of values.yaml): the
# application normally runs against managed services.
dependencies:
  - name: redis
    alias: redis
    version: 0.27.9
    repository: oci://registry-1.docker.io/cloudpirates
    condition: redis.enabled
  - name: postgres
    alias: postgres
    version: 0.19.6
    repository: oci://registry-1.docker.io/cloudpirates
    condition: postgres.enabled
  - name: rustfs
    alias: rustfs
    version: 0.10.0
    repository: oci://registry-1.docker.io/cloudpirates
    condition: rustfs.enabled
sources:
  - https://github.com/mitchou10/spreadsheet-analyser
  - https://github.com/this-is-tobi/helm-charts
maintainers: []
