frontend:
  # -- Workload kind to deploy the app as. One of "Deployment", "StatefulSet" or "DaemonSet"
  # (validated at render time - an unknown value fails instead of producing a release with no
  # workload). Use the top-level `jobs` / `cronjobs` maps for one-off or scheduled workloads.
  # Some values only apply to certain kinds: `replicaCount`/`autoscaling` and `strategy` are
  # Deployment-only (`autoscaling` also works on a StatefulSet), `volumeClaims`/`extraVolumeClaims`
  # are StatefulSet-only, and `updateStrategy` covers StatefulSet and DaemonSet.
  # @section -- Frontend
  deploymentType: "Deployment"
  # -- The number of application controller pods to run. Ignored when `deploymentType` is
  # "DaemonSet" (one pod per node) or when `autoscaling.enabled` is true.
  # @section -- Frontend
  replicaCount: 1
  image:
    # -- Registry to use for the app.
    # @section -- Frontend
    registry: "ghcr.io"
    # -- Repository to use for the app.
    # @section -- Frontend
    repository: "mitchou10/spreadsheet-analyser/frontend"
    # -- Image pull policy for the app.
    # @section -- Frontend
    pullPolicy: "IfNotPresent"
    # -- Tag to use for the app.
    # @section -- Frontend
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
    # -- Image digest (`sha256:...`). When set it takes precedence over `tag`, pinning the exact
    # image content so the same release can never resolve to a different build - preferred over a
    # mutable tag for anything you deploy to production.
    # @section -- Frontend
    digest: ""
  ingress:
    # -- Whether or not ingress should be enabled.
    # @section -- Frontend
    enabled: false
    # -- Defines which ingress controller will implement the resource.
    # @section -- Frontend
    className: ""
    # -- Additional ingress annotations.
    # @section -- Frontend
    annotations: {}
    # -- Additional ingress labels.
    # @section -- Frontend
    labels: {}
    hosts:
      -  # -- Name of the host record.
        # @section -- Frontend
        name: "domain.local"
        # -- Paths of the host record to manage routing (avoids repeating the same host for
        # multiple paths/backends).
        # @section -- Frontend
        paths:
          -  # -- Path of the host record to manage routing.
            # @section -- Frontend
            path: "/"
            # -- Path type of the host record.
            # @section -- Frontend
            pathType: "Prefix"
            backend:
              # -- Name of the backend service linked to the path (leave empty to use the app service).
              # @section -- Frontend
              serviceName: ""
              # -- Port used by the backend service linked to the path (leave null to use the app service port).
              # @section -- Frontend
              portNumber: null
    # -- Enable TLS configuration.
    # @section -- Frontend
    tls: []
    # - secretName: domain.local-tls
    #   hosts:
    #   - domain.local
  ## Gateway API HTTPRoute configuration (alternative to Ingress)
  ## Ref: https://gateway-api.sigs.k8s.io/api-types/httproute/
  httpRoute:
    # -- Enable an HTTPRoute resource for this service.
    # @section -- Frontend
    enabled: false
    # -- Additional HTTPRoute annotations.
    # @section -- Frontend
    annotations: {}
    # -- Additional HTTPRoute labels.
    # @section -- Frontend
    labels: {}
    # -- Parent references (Gateways) to attach the HTTPRoute to.
    # @section -- Frontend
    parentRefs: []
    # - name: my-gateway
    #   namespace: gateway-namespace  # optional
    #   sectionName: https            # optional, specific listener name
    # -- Hostnames for the HTTPRoute to match.
    # @section -- Frontend
    hostnames: []
    # - "example.com"
    # - "api.example.com"
    # -- Routing rules for the HTTPRoute.
    # @section -- Frontend
    rules: []
    # - matches:
    #   - path:
    #       type: PathPrefix     # PathPrefix, Exact, or RegularExpression
    #       value: "/"
    #     headers:
    #     - type: Exact
    #       name: "x-version"
    #       value: "v1"
    #     method: GET
    #   filters:
    #   - type: RequestHeaderModifier
    #     requestHeaderModifier:
    #       add:
    #       - name: "x-custom-header"
    #         value: "my-value"
    #   backendRefs:
    #   - name: my-service       # defaults to chart service if not set
    #     port: 80               # defaults to service port if not set
    #     weight: 100            # for traffic splitting
  ## Gateway API GRPCRoute configuration (for gRPC services)
  ## Ref: https://gateway-api.sigs.k8s.io/api-types/grpcroute/
  grpcRoute:
    # -- Enable a GRPCRoute resource for this service.
    # @section -- Frontend
    enabled: false
    # -- Additional GRPCRoute annotations.
    # @section -- Frontend
    annotations: {}
    # -- Additional GRPCRoute labels.
    # @section -- Frontend
    labels: {}
    # -- Parent references (Gateways) to attach the GRPCRoute to.
    # @section -- Frontend
    parentRefs: []
    # - name: my-gateway
    #   namespace: gateway-namespace
    #   sectionName: grpc
    # -- Hostnames for the GRPCRoute to match.
    # @section -- Frontend
    hostnames: []
    # - "grpc.example.com"
    # -- Routing rules for the GRPCRoute.
    # @section -- Frontend
    rules: []
    # - matches:
    #   - method:
    #       type: Exact          # Exact or RegularExpression
    #       service: "mypackage.MyService"
    #       method: "MyMethod"
    #     headers:
    #     - type: Exact
    #       name: "x-version"
    #       value: "v1"
    #   backendRefs:
    #   - name: my-grpc-service
    #     port: 50051
    #     weight: 100
  # -- Mount the ServiceAccount token into the app pods. Defaults to false so a compromised
  # container holds no API credentials; the API server does not need the token unless the app
  # actually talks to the Kubernetes API. Applied at pod level so it holds even when
  # `serviceAccount.name` points at an SA that automounts.
  # @section -- Frontend
  automountServiceAccountToken: false
  # -- Inject the legacy `{SVC}_SERVICE_HOST`/`_PORT` environment variables for every Service in the
  # namespace. Defaults to false: the variables are rarely used, leak the namespace's topology into
  # every container, and can collide with the app's own configuration. Set to true only for an app
  # that genuinely reads them.
  # @section -- Frontend
  enableServiceLinks: false
  # -- Annotations for the app deployed pods.
  # @section -- Frontend
  podAnnotations: {}
  # -- Labels for the app deployed pods.
  # @section -- Frontend
  podLabels: {}
  # -- Pod-level security context. Defaults to a hardened baseline that satisfies the `restricted`
  # Pod Security Standard. Rendered via `toYaml`, so any `PodSecurityContext` field is accepted.
  # Adjust the UID/GID to whatever your image actually ships with - `runAsNonRoot` makes the
  # kubelet refuse to start a container that would run as root, which is the intended failure mode
  # rather than something to switch off. Set to `null` to omit the block entirely.
  # @section -- Frontend
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    # Owns mounted volumes so a non-root container can still write to them.
    fsGroup: 1000
    # Only chown volume contents when the top-level dir doesn't already match, which avoids
    # re-chowning large volumes on every start.
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile:
      type: "RuntimeDefault"
  # -- Init containers to add to the app pod.
  # @section -- Frontend
  initContainers: []
  # - name: wait-for-keycloak
  #   image: docker.io/curlimages/curl:latest
  #   command:
  #   - "/bin/sh"
  #   - "-c"
  #   args:
  #   - "while [ $(curl -sw '%{http_code}' http://webapp.svc.cluster.local -o /dev/null) -ne 200 ]; do sleep 5; echo 'Waiting for the webapp...'; done"
  #   volumeMounts:
  #   - mountPath: /custom-volume
  #     name: custom-volume
  # -- Extra containers to add to the app pod as sidecars.
  # @section -- Frontend
  extraContainers: []
  # - name: fluentd
  #   image: "fluentd"
  #   volumeMounts:
  #     - mountPath: /my-volume/config
  #       name: config
  # -- Frontend container port number. Set to `null`/`0` (and disable `service`/probes) for
  # components that don't listen on any port (e.g. a queue consumer).
  # @section -- Frontend
  containerPort: &frontendContainerPort 8080
  # -- Frontend container port name.
  # @section -- Frontend
  containerPortName: "http"
  # -- Frontend extra container ports.
  # @section -- Frontend
  extraPorts: []
  # - containerPort: 9090
  #   protocol: "TCP"
  # -- Frontend container command.
  # @section -- Frontend
  command: []
  # -- Frontend container command args.
  # @section -- Frontend
  args: []
  # -- Container-level security context. Defaults to a hardened baseline that satisfies the
  # `restricted` Pod Security Standard: no privilege escalation, no capabilities, immutable root
  # filesystem. Rendered via `toYaml`, so any `SecurityContext` field is accepted. Note
  # `readOnlyRootFilesystem` requires the app to write only to mounted volumes - the default
  # `volumes`/`volumeMounts` below provide an `emptyDir` on /tmp for that reason. Set to `null` to
  # omit the block entirely.
  # @section -- Frontend
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    capabilities:
      drop:
        - "ALL"
  # -- Frontend container env variables loaded from configmap or secret reference. List or map
  # (merged with `global.envFrom` above, global entries first); see `global.envFrom` for both forms.
  # @section -- Frontend
  envFrom: []
  # - configMapRef:
  #     name: my-config
  # - secretRef:
  #     name: my-secret
  # -- Map or array of environment variables to inject into the app container (`valueFrom` supported).
  # @section -- Frontend
  env: {}
  # A: "A"
  # B:
  #   valueFrom:
  #     configMapKeyRef:
  #       name: "my-config"
  #       key: "B"
  # C:
  #   valueFrom:
  #     secretKeyRef:
  #       name: "my-secret"
  #       key: "C"
  #
  # - name: "A"
  #   value: "A"
  # - name: "B"
  #   valueFrom:
  #     configMapKeyRef:
  #       name: "my-config"
  #       key: "B"
  # - name: "C"
  #   valueFrom:
  #     secretKeyRef:
  #       name: "my-secret"
  #       key: "C"
  # -- Map of environment variables to inject into a configmap loaded by the app container (`valueFrom` not supported).
  # @section -- Frontend
  envCm: {}
  # D: "D"
  # -- Map of environment variables to inject into a secret loaded by the app container (`valueFrom`
  # not supported). Values placed here are stored in plain text in the values file AND in the Helm
  # release secret, so use it for non-sensitive-but-secret-shaped config only. For real credentials
  # prefer referencing a Secret you manage elsewhere via `envFrom`, or have an operator materialise
  # it (see the `VaultStaticSecret` example under `extraObjects`).
  # @section -- Frontend
  envSecret: {}
  # E: "E"
  ## Each probe is rendered verbatim via `toYaml`, so any `Probe` field (`exec`, `tcpSocket`,
  ## `grpc`...) is accepted, not just the `httpGet` shown here. To DISABLE a probe, set it to
  ## `null` - `{}` does not work, because Helm deep-merges values files and would merge these
  ## defaults straight back in.
  probes:
    startupProbe:
      httpGet:
        # -- Frontend container healthcheck endpoint (startupProbe is defined using `toYaml` so it is possible to override it completely).
        # @section -- Frontend
        path: "/"
        # -- Port to use for healthcheck (defaults to container port).
        # @section -- Frontend
        port: *frontendContainerPort
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Frontend
      initialDelaySeconds: 0
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Frontend
      successThreshold: 1
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Frontend
      failureThreshold: 10
      # -- How often (in seconds) to perform the probe.
      # @section -- Frontend
      periodSeconds: 10
      # -- Number of seconds after which the probe times out.
      # @section -- Frontend
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        # -- Frontend container healthcheck endpoint (readinessProbe is defined using `toYaml` so it is possible to override it completely).
        # @section -- Frontend
        path: "/"
        # -- Port to use for healthcheck (defaults to container port).
        # @section -- Frontend
        port: *frontendContainerPort
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Frontend
      initialDelaySeconds: 10
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Frontend
      successThreshold: 2
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Frontend
      failureThreshold: 2
      # -- How often (in seconds) to perform the probe.
      # @section -- Frontend
      periodSeconds: 10
      # -- Number of seconds after which the probe times out.
      # @section -- Frontend
      timeoutSeconds: 5
    livenessProbe:
      httpGet:
        # -- Frontend container healthcheck endpoint (livenessProbe is defined using `toYaml` so it is possible to override it completely).
        # @section -- Frontend
        path: "/"
        # -- Port to use for healthcheck (defaults to container port).
        # @section -- Frontend
        port: *frontendContainerPort
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Frontend
      initialDelaySeconds: 30
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Frontend
      successThreshold: 1
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Frontend
      failureThreshold: 3
      # -- How often (in seconds) to perform the probe.
      # @section -- Frontend
      periodSeconds: 30
      # -- Number of seconds after which the probe times out.
      # @section -- Frontend
      timeoutSeconds: 5
  ## Deployment-only. StatefulSet and DaemonSet use `updateStrategy` below - their update
  ## strategies are a different API shape (no `Recreate`, and different `rollingUpdate` fields),
  ## so they are kept as separate values rather than one block that means three different things.
  strategy:
    # -- Strategy type used to replace old Pods by new ones, can be `Recreate` or `RollingUpdate`.
    # Only applied when `deploymentType` is "Deployment".
    # @section -- Frontend
    type: "RollingUpdate"
    rollingUpdate:
      # -- The maximum number of pods that can be unavailable during the update process.
      # @section -- Frontend
      maxUnavailable: 1
      # -- The maximum number of pods that can be scheduled above the desired number of pods.
      # @section -- Frontend
      maxSurge: 1
  # -- Update strategy applied when `deploymentType` is "StatefulSet" or "DaemonSet" (ignored for
  # a Deployment, which uses `strategy` above). Rendered verbatim via `toYaml`, so it takes the
  # native `StatefulSetUpdateStrategy`/`DaemonSetUpdateStrategy` shape of the selected kind; left
  # empty, Kubernetes applies its own default (`RollingUpdate` for both).
  # @section -- Frontend
  updateStrategy: {}
  # StatefulSet:
  #   type: "RollingUpdate"        # RollingUpdate or OnDelete
  #   rollingUpdate:
  #     partition: 0
  #     maxUnavailable: 1
  # DaemonSet:
  #   type: "RollingUpdate"        # RollingUpdate or OnDelete
  #   rollingUpdate:
  #     maxUnavailable: 1
  #     maxSurge: 0
  # -- Image credentials configuration.
  # @section -- Frontend
  imagePullSecrets: []
  # - name: "pullsecret-name-1"
  #   create: false
  # - name: "pullsecret-name-2"
  #   create: true
  #   registry: ""
  #   username: ""
  #   password: ""
  #   email: ""
  ## Node-level pod settings. Mostly relevant when `deploymentType` is "DaemonSet" (node agents,
  ## log/metric collectors), but valid for every kind.
  # -- Share the host network namespace. Container ports then bind directly on the node, so they
  # must not collide with anything else running there.
  # @section -- Frontend
  hostNetwork: false
  # -- Share the host PID namespace (lets the container see and signal host processes).
  # @section -- Frontend
  hostPID: false
  # -- Pod DNS policy. Left empty, it defaults to `ClusterFirstWithHostNet` when `hostNetwork` is
  # true (otherwise a hostNetwork pod silently stops resolving cluster DNS) and to the Kubernetes
  # default `ClusterFirst` when it isn't.
  # @section -- Frontend
  # @default -- `""` (`ClusterFirstWithHostNet` when `hostNetwork` is true)
  dnsPolicy: ""
  # -- Pod DNS configuration, merged with `dnsPolicy` by the kubelet.
  # @section -- Frontend
  dnsConfig: {}
  # nameservers:
  # - "1.1.1.1"
  # options:
  # - name: "ndots"
  #   value: "2"
  # searches:
  # - "my.dns.search.suffix"
  # -- PriorityClass to schedule the pods with (e.g. `system-node-critical` for a node agent that
  # must not be evicted under pressure).
  # @section -- Frontend
  priorityClassName: ""
  # -- (int) Grace period, in seconds, given to the pod to shut down cleanly before it is killed.
  # @section -- Frontend
  # @default -- `null` (Kubernetes default of 30)
  terminationGracePeriodSeconds: null
  # -- Topology spread constraints used to spread the pods across failure domains.
  # @section -- Frontend
  topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: "topology.kubernetes.io/zone"
  #   whenUnsatisfiable: "ScheduleAnyway"
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/name: "helm-frontend"
  # -- Host aliases that will be injected at pod-level into /etc/hosts.
  # @section -- Frontend
  hostAliases: []
  # - ip: "127.0.0.1"
  #   hostnames:
  #   - "foo.local"
  #   - "bar.local"
  # - ip: "10.1.2.3"
  #   hostnames:
  #   - "foo.remote"
  #   - "bar.remote"
  # -- List of volumes to add. Prefer this for volumes the chart itself always needs (e.g.
  # security-hardening `emptyDir`s); use `extraVolumes` below for anything you add on top, so
  # overriding one doesn't require repeating the other. Defaults to a `/tmp` `emptyDir`, which is
  # what makes the default `securityContext.readOnlyRootFilesystem: true` usable - drop it only if
  # you also relax that. Helm replaces lists wholesale rather than merging them, so overriding this
  # key means restating the entries you want to keep.
  # @section -- Frontend
  volumes:
    - name: "tmp"
      emptyDir: {}
  # - name: config-volume
  #   configMap:
  #     name: log-config
  #     items:
  #       - key: log_level
  #         path: log_level.conf
  # - name: cache-volume
  #   emptyDir:
  #     sizeLimit: 500Mi
  # - name: image-volume
  #   image:
  #     reference: quay.io/crio/artifact:v2
  #     pullPolicy: IfNotPresent
  # -- Additional volumes to add, concatenated with `volumes` above at render time (e.g. to
  # mount a cert or config from a values override without repeating the chart's own volumes).
  # @section -- Frontend
  extraVolumes: []
  # - name: certs
  #   secret:
  #     secretName: my-tls-cert
  # -- List of volumeClaims to add, rendered as the StatefulSet's `volumeClaimTemplates`. Requires
  # `deploymentType: "StatefulSet"` - setting it on a Deployment or DaemonSet fails at render time
  # rather than being silently dropped (use `volumes`/`extraVolumes` there instead).
  # @section -- Frontend
  volumeClaims: []
  # - metadata:
  #     name: app-volume
  #   spec:
  #     accessModes: [ "ReadWriteOnce" ]
  #     storageClassName: "my-storage-class"
  #     resources:
  #       requests:
  #         storage: 1Gi
  # -- Additional volumeClaims to add, concatenated with `volumeClaims` above at render time.
  # @section -- Frontend
  extraVolumeClaims: []
  # -- List of mounts to add (normally used with `volumes` or `volumeClaims`). Prefer this for
  # mounts the chart itself always needs; use `extraVolumeMounts` below for anything you add
  # on top, so overriding one doesn't require repeating the other. Defaults to the `/tmp` mount
  # backing the hardened `readOnlyRootFilesystem` default (see `volumes` above).
  # @section -- Frontend
  volumeMounts:
    - name: "tmp"
      mountPath: "/tmp"
  # - name: config-volume
  #   mountPath: /app/config
  #   subPath: config
  #   readOnly: true
  #   mountPropagation: None
  #   recursiveReadOnly: Enabled
  # - name: cache-volume
  #   mountPath: /app/cache
  # - name: image-volume
  #   mountPath: /app/content
  # - name: storage-volume
  #   mountPath: /app/storage
  # -- Additional volumeMounts to add, concatenated with `volumeMounts` above at render time.
  # @section -- Frontend
  extraVolumeMounts: []
  # - name: certs
  #   mountPath: /etc/certs
  #   readOnly: true
  service:
    # -- Whether or not to create a Service for the app. Set to `false` for components that
    # don't accept traffic (e.g. a queue consumer with no `containerPort`).
    # @section -- Frontend
    enabled: true
    # -- Type of service to create for the app.
    # @section -- Frontend
    type: "ClusterIP"
    # -- Port used by the service.
    # @section -- Frontend
    port: 80
    # -- (int) Port used when type is `NodePort` to expose the service on the given node port. Left
    # empty, Kubernetes allocates one from the configured node-port range, which avoids two
    # releases of this chart colliding on the same hardcoded port.
    # @section -- Frontend
    # @default -- `null` (allocated by Kubernetes)
    nodePort: null
    # -- Port name used by the service.
    # @section -- Frontend
    portName: "http"
    # -- Protocol used by the service.
    # @section -- Frontend
    protocol: "TCP"
    # -- Extra service ports.
    # @section -- Frontend
    extraPorts: []
    # - port: 9090
    #   targetPort: 9090
    #   protocol: "TCP"
    #   name: "metrics"
  resources:
    requests:
      # -- Memory request for the app.
      # @section -- Frontend
      memory: "256Mi"
      # -- CPU request for the app.
      # @section -- Frontend
      cpu: "100m"
      # Other stuff like GPU, etc could be added here.
      # nvidia.com/gpu: "1"
      # ephemeral-storage: "100Mi"
    limits:
      # -- Memory limit for the app.
      # @section -- Frontend
      memory: "2Gi"
      # -- CPU limit for the app.
      # @section -- Frontend
      cpu: "500m"
      # Other stuff like GPU, etc could be added here.
      # nvidia.com/gpu: "1"
      # ephemeral-storage: "500Mi"
  autoscaling:
    # -- Enable Horizontal Pod Autoscaler for the app.
    # @section -- Frontend
    enabled: false
    # -- Minimum number of replicas for the app.
    # @section -- Frontend
    minReplicas: 1
    # -- Maximum number of replicas for the app.
    # @section -- Frontend
    maxReplicas: 3
    # -- Average CPU utilization percentage for the app.
    # @section -- Frontend
    targetCPUUtilizationPercentage: 80
    # -- Average memory utilization percentage for the app.
    # @section -- Frontend
    targetMemoryUtilizationPercentage: 80
  # -- Revision history limit for the app.
  # @section -- Frontend
  revisionHistoryLimit: 10
  # -- Default node selector for app.
  # @section -- Frontend
  nodeSelector: {}
  # kubernetes.io/os: "linux"
  # kubernetes.io/arch: "amd64"
  # kubernetes.io/hostname: "node1"
  # -- Default tolerations for app.
  # @section -- Frontend
  tolerations: []
  # - key: "key1"
  #   operator: "Equal"
  #   value: "value1"
  #   effect: "NoSchedule"
  #   tolerationSeconds: 3600
  # - key: "key2"
  #   operator: "Equal"
  #   value: "value2"
  #   effect: "NoExecute"
  #   tolerationSeconds: 3600
  # - key: "key3"
  #   operator: "Exists"
  #   effect: "PreferNoSchedule"
  #   tolerationSeconds: 3600
  # -- Affinity used for app pod.
  # @section -- Frontend
  affinity: {}
  # podAntiAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #   - labelSelector:
  #       matchExpressions:
  #       - key: "app.kubernetes.io/name"
  #         operator: "In"
  #         values:
  #         - "helm-frontend"
  #     topologyKey: "kubernetes.io/hostname"
  serviceAccount:
    # -- Enable the service account.
    # @section -- Frontend
    enabled: false
    # -- Create a service account.
    # @section -- Frontend
    create: false
    # -- Annotations applied to created service account.
    # @section -- Frontend
    annotations: {}
    # -- Service account name.
    # @section -- Frontend
    name: ""
    # -- Should the service account access token be automount in the pod.
    # @section -- Frontend
    automountServiceAccountToken: false
    role:
      # -- Should the role be created.
      # @section -- Frontend
      create: false
      # -- Role rules associated with the service account.
      # @section -- Frontend
      rules: []
      # - apiGroups:
      #   - argoproj.io
      #   resources:
      #   - applications
      #   - applicationsets
      #   - appprojects
      #   verbs:
      #   - create
      #   - get
      #   - list
      #   - watch
      #   - update
      #   - delete
      #   - patch
    clusterRole:
      # -- Should the clusterRole be created.
      # @section -- Frontend
      create: false
      # -- ClusterRole rules associated with the service account.
      # @section -- Frontend
      rules: []
      # - apiGroups:
      #   - argoproj.io
      #   resources:
      #   - applications
      #   - applicationsets
      #   - appprojects
      #   verbs:
      #   - create
      #   - get
      #   - list
      #   - watch
      #   - update
      #   - delete
      #   - patch
  ## Ref: https://kubernetes.io/docs/tasks/run-application/configure-pdb/
  pdb:
    # -- Deploy a PodDisruptionBudget for the app
    # @section -- Frontend
    enabled: false
    # -- Labels to be added to app pdb.
    # @section -- Frontend
    labels: {}
    # -- Annotations to be added to app pdb.
    # @section -- Frontend
    annotations: {}
    # -- Number of pods that are available after eviction as number or percentage (eg.: 50%). One
    # of `minAvailable` / `maxUnavailable` must be set when `pdb.enabled` is true - a budget of 0
    # is the same as having no budget at all, so leaving both empty fails at render time.
    # @section -- Frontend
    minAvailable: ""
    # -- Number of pods that are unavailable after eviction as number or percentage (eg.: 50%). Has higher precedence over `frontend.pdb.minAvailable`.
    # @section -- Frontend
    maxUnavailable: ""
  networkPolicy:
    # -- Create NetworkPolicy object for the app. The policy always selects this component's pods
    # only (via its selector labels), never the whole namespace.
    # @section -- Frontend
    create: false
    # -- Labels to be added to the app NetworkPolicy.
    # @section -- Frontend
    labels: {}
    # -- Annotations to be added to the app NetworkPolicy.
    # @section -- Frontend
    annotations: {}
    # -- Policy types used in the NetworkPolicy object.
    # @section -- Frontend
    policyTypes:
      - Ingress
    # -- Ingress rules for the NetworkPolicy object.
    # @section -- Frontend
    ingress: []
    # - from:
    #   - ipBlock:
    #       cidr: 172.17.0.0/16
    #       except:
    #       - 172.17.1.0/24
    #   - namespaceSelector:
    #       matchLabels:
    #         project: myproject
    #   - podSelector:
    #       matchLabels:
    #         role: frontend
    #   ports:
    #   - protocol: TCP
    #     port: 6379
    # -- Egress rules for the NetworkPolicy object.
    # @section -- Frontend
    egress: []
    # - to:
    #   - ipBlock:
    #       cidr: 10.0.0.0/24
    #   ports:
    #   - protocol: TCP
    #     port: 32000
    #     endPort: 32768
  metrics:
    # -- Deploy metrics service.
    # @section -- Frontend
    enabled: false
    service:
      # -- Type of metrics service to create.
      # @section -- Frontend
      type: "ClusterIP"
      # -- Metrics service annotations.
      # @section -- Frontend
      annotations: {}
      # -- Metrics service labels.
      # @section -- Frontend
      labels: {}
      # -- Metrics service port name.
      # @section -- Frontend
      portName: "metrics"
      # -- Metrics service port.
      # @section -- Frontend
      port: 9000
      # -- Metrics service target port.
      # @section -- Frontend
      targetPort: 9000
    serviceMonitor:
      # -- Enable a prometheus ServiceMonitor.
      # @section -- Frontend
      enabled: false
      # -- Prometheus ServiceMonitor labels.
      # @section -- Frontend
      labels: {}
      # -- Prometheus ServiceMonitor annotations.
      # @section -- Frontend
      annotations: {}
      endpoints:
        - basicAuth:
            # -- The secret in the service monitor namespace that contains the username for authentication.
            # @section -- Frontend
            username: ""
            # -- The secret in the service monitor namespace that contains the password for authentication.
            # @section -- Frontend
            password: ""
          bearerTokenSecret:
            # -- Secret name to mount to read bearer token for scraping targets. The secret needs to be in the same namespace as the service monitor and accessible by the Prometheus Operator.
            # @section -- Frontend
            name: ""
            # -- Secret key to mount to read bearer token for scraping targets. The secret needs to be in the same namespace as the service monitor and accessible by the Prometheus Operator.
            # @section -- Frontend
            key: ""
          # -- Prometheus ServiceMonitor interval.
          # @section -- Frontend
          interval: "30s"
          # -- Prometheus ServiceMonitor scrapeTimeout. If empty, Prometheus uses the global scrape timeout unless it is less than the target's scrape interval value in which the latter is used.
          # @section -- Frontend
          scrapeTimeout: "10s"
          # -- Path used by the Prometheus ServiceMonitor to scrape metrics.
          # @section -- Frontend
          path: "/metrics"
          # -- When true, honorLabels preserves the metric’s labels when they collide with the target’s labels.
          # @section -- Frontend
          honorLabels: false
          # -- Prometheus RelabelConfigs to apply to samples before scraping.
          # @section -- Frontend
          relabelings: []
          # -- Prometheus MetricRelabelConfigs to apply to samples before ingestion.
          # @section -- Frontend
          metricRelabelings: []
          # -- Prometheus ServiceMonitor selector.
          # @section -- Frontend
          selector: {}
          # prometheus: kube-prometheus
          # -- Prometheus ServiceMonitor scheme.
          # @section -- Frontend
          scheme: ""
          # -- Prometheus ServiceMonitor tlsConfig.
          # @section -- Frontend
          tlsConfig: {}
agent_worker:
  # -- Workload kind to deploy the app as. One of "Deployment", "StatefulSet" or "DaemonSet"
  # (validated at render time - an unknown value fails instead of producing a release with no
  # workload). Use the top-level `jobs` / `cronjobs` maps for one-off or scheduled workloads.
  # Some values only apply to certain kinds: `replicaCount`/`autoscaling` and `strategy` are
  # Deployment-only (`autoscaling` also works on a StatefulSet), `volumeClaims`/`extraVolumeClaims`
  # are StatefulSet-only, and `updateStrategy` covers StatefulSet and DaemonSet.
  # @section -- Agent_worker
  deploymentType: "Deployment"
  # -- The number of application controller pods to run. Ignored when `deploymentType` is
  # "DaemonSet" (one pod per node) or when `autoscaling.enabled` is true.
  # @section -- Agent_worker
  replicaCount: 1
  image:
    # -- Registry to use for the app.
    # @section -- Agent_worker
    registry: "ghcr.io"
    # -- Repository to use for the app.
    # @section -- Agent_worker
    repository: "mitchou10/spreadsheet-analyser/agent-worker"
    # -- Image pull policy for the app.
    # @section -- Agent_worker
