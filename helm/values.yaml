  # what makes the default `securityContext.readOnlyRootFilesystem: true` usable - drop it only if
  # you also relax that. Helm replaces lists wholesale rather than merging them, so overriding this
  # key means restating the entries you want to keep.
  # @section -- Backend
  volumes:
    - name: "tmp"
      emptyDir: {}
  # - name: config-volume
  #   configMap:
