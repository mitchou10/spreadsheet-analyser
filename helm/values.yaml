  #     pullPolicy: IfNotPresent
  # -- Additional volumes to add, concatenated with `volumes` above at render time (e.g. to
  # mount a cert or config from a values override without repeating the chart's own volumes).
  # @section -- Analysis_worker
  extraVolumes: []
  # - name: certs
  #   secret:
  #     secretName: my-tls-cert
  # -- List of volumeClaims to add, rendered as the StatefulSet's `volumeClaimTemplates`. Requires
  # `deploymentType: "StatefulSet"` - setting it on a Deployment or DaemonSet fails at render time
  # rather than being silently dropped (use `volumes`/`extraVolumes` there instead).
  # @section -- Analysis_worker
  volumeClaims: []
  # - metadata:
  #     name: app-volume
  #   spec:
  #     accessModes: [ "ReadWriteOnce" ]
  #     storageClassName: "my-storage-class"
  #     resources:
  #       requests:
  #         storage: 1Gi
  # -- Additional volumeClaims to add, concatenated with `volumeClaims` above at render time.
  # @section -- Analysis_worker
  extraVolumeClaims: []
  # -- List of mounts to add (normally used with `volumes` or `volumeClaims`). Prefer this for
  # mounts the chart itself always needs; use `extraVolumeMounts` below for anything you add
  # on top, so overriding one doesn't require repeating the other. Defaults to the `/tmp` mount
  # backing the hardened `readOnlyRootFilesystem` default (see `volumes` above).
  # @section -- Analysis_worker
  volumeMounts:
    - name: "tmp"
      mountPath: "/tmp"
  # - name: config-volume
  #   mountPath: /app/config
  #   subPath: config
  #   readOnly: true
  #   mountPropagation: None
  #   recursiveReadOnly: Enabled
  # - name: cache-volume
  #   mountPath: /app/cache
  # - name: image-volume
  #   mountPath: /app/content
  # - name: storage-volume
  #   mountPath: /app/storage
  # -- Additional volumeMounts to add, concatenated with `volumeMounts` above at render time.
  # @section -- Analysis_worker
  extraVolumeMounts: []
  # - name: certs
  #   mountPath: /etc/certs
  #   readOnly: true
  service:
    # -- Whether or not to create a Service for the app. Set to `false` for components that
    # don't accept traffic (e.g. a queue consumer with no `containerPort`).
    # @section -- Analysis_worker
    enabled: false
    # -- Type of service to create for the app.
    # @section -- Analysis_worker
    type: "ClusterIP"
    # -- Port used by the service.
    # @section -- Analysis_worker
    port: 80
    # -- (int) Port used when type is `NodePort` to expose the service on the given node port. Left
    # empty, Kubernetes allocates one from the configured node-port range, which avoids two
    # releases of this chart colliding on the same hardcoded port.
    # @section -- Analysis_worker
    # @default -- `null` (allocated by Kubernetes)
    nodePort: null
    # -- Port name used by the service.
    # @section -- Analysis_worker
    portName: "http"
    # -- Protocol used by the service.
    # @section -- Analysis_worker
    protocol: "TCP"
    # -- Extra service ports.
    # @section -- Analysis_worker
    extraPorts: []
    # - port: 9090
    #   targetPort: 9090
    #   protocol: "TCP"
    #   name: "metrics"
  resources:
    requests:
      # -- Memory request for the app.
      # @section -- Analysis_worker
      memory: "256Mi"
      # -- CPU request for the app.
      # @section -- Analysis_worker
      cpu: "100m"
      # Other stuff like GPU, etc could be added here.
      # nvidia.com/gpu: "1"
      # ephemeral-storage: "100Mi"
    limits:
      # -- Memory limit for the app.
      # @section -- Analysis_worker
      memory: "2Gi"
      # -- CPU limit for the app.
      # @section -- Analysis_worker
      cpu: "500m"
      # Other stuff like GPU, etc could be added here.
      # nvidia.com/gpu: "1"
      # ephemeral-storage: "500Mi"
  autoscaling:
    # -- Enable Horizontal Pod Autoscaler for the app.
    # @section -- Analysis_worker
    enabled: false
    # -- Minimum number of replicas for the app.
    # @section -- Analysis_worker
    minReplicas: 1
    # -- Maximum number of replicas for the app.
    # @section -- Analysis_worker
    maxReplicas: 3
    # -- Average CPU utilization percentage for the app.
    # @section -- Analysis_worker
    targetCPUUtilizationPercentage: 80
    # -- Average memory utilization percentage for the app.
    # @section -- Analysis_worker
    targetMemoryUtilizationPercentage: 80
  # -- Revision history limit for the app.
  # @section -- Analysis_worker
  revisionHistoryLimit: 10
  # -- Default node selector for app.
  # @section -- Analysis_worker
  nodeSelector: {}
  # kubernetes.io/os: "linux"
  # kubernetes.io/arch: "amd64"
  # kubernetes.io/hostname: "node1"
  # -- Default tolerations for app.
  # @section -- Analysis_worker
  tolerations: []
  # - key: "key1"
  #   operator: "Equal"
  #   value: "value1"
  #   effect: "NoSchedule"
  #   tolerationSeconds: 3600
  # - key: "key2"
  #   operator: "Equal"
  #   value: "value2"
  #   effect: "NoExecute"
  #   tolerationSeconds: 3600
  # - key: "key3"
  #   operator: "Exists"
  #   effect: "PreferNoSchedule"
  #   tolerationSeconds: 3600
  # -- Affinity used for app pod.
  # @section -- Analysis_worker
  affinity: {}
  # podAntiAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #   - labelSelector:
  #       matchExpressions:
  #       - key: "app.kubernetes.io/name"
  #         operator: "In"
  #         values:
  #         - "helm-analysis_worker"
  #     topologyKey: "kubernetes.io/hostname"
  serviceAccount:
    # -- Enable the service account.
    # @section -- Analysis_worker
    enabled: false
    # -- Create a service account.
    # @section -- Analysis_worker
    create: false
    # -- Annotations applied to created service account.
    # @section -- Analysis_worker
    annotations: {}
    # -- Service account name.
    # @section -- Analysis_worker
    name: ""
    # -- Should the service account access token be automount in the pod.
    # @section -- Analysis_worker
    automountServiceAccountToken: false
    role:
      # -- Should the role be created.
      # @section -- Analysis_worker
      create: false
      # -- Role rules associated with the service account.
      # @section -- Analysis_worker
      rules: []
      # - apiGroups:
      #   - argoproj.io
      #   resources:
      #   - applications
      #   - applicationsets
      #   - appprojects
      #   verbs:
      #   - create
      #   - get
      #   - list
      #   - watch
      #   - update
      #   - delete
      #   - patch
    clusterRole:
      # -- Should the clusterRole be created.
      # @section -- Analysis_worker
      create: false
      # -- ClusterRole rules associated with the service account.
      # @section -- Analysis_worker
      rules: []
      # - apiGroups:
      #   - argoproj.io
      #   resources:
      #   - applications
      #   - applicationsets
      #   - appprojects
      #   verbs:
      #   - create
      #   - get
      #   - list
      #   - watch
      #   - update
      #   - delete
      #   - patch
  ## Ref: https://kubernetes.io/docs/tasks/run-application/configure-pdb/
  pdb:
    # -- Deploy a PodDisruptionBudget for the app
    # @section -- Analysis_worker
    enabled: false
    # -- Labels to be added to app pdb.
    # @section -- Analysis_worker
    labels: {}
    # -- Annotations to be added to app pdb.
    # @section -- Analysis_worker
    annotations: {}
    # -- Number of pods that are available after eviction as number or percentage (eg.: 50%). One
    # of `minAvailable` / `maxUnavailable` must be set when `pdb.enabled` is true - a budget of 0
    # is the same as having no budget at all, so leaving both empty fails at render time.
    # @section -- Analysis_worker
    minAvailable: ""
    # -- Number of pods that are unavailable after eviction as number or percentage (eg.: 50%). Has higher precedence over `analysis_worker.pdb.minAvailable`.
    # @section -- Analysis_worker
    maxUnavailable: ""
  networkPolicy:
    # -- Create NetworkPolicy object for the app. The policy always selects this component's pods
    # only (via its selector labels), never the whole namespace.
    # @section -- Analysis_worker
    create: false
    # -- Labels to be added to the app NetworkPolicy.
    # @section -- Analysis_worker
    labels: {}
    # -- Annotations to be added to the app NetworkPolicy.
    # @section -- Analysis_worker
    annotations: {}
    # -- Policy types used in the NetworkPolicy object.
    # @section -- Analysis_worker
    policyTypes:
      - Ingress
    # -- Ingress rules for the NetworkPolicy object.
    # @section -- Analysis_worker
    ingress: []
    # - from:
    #   - ipBlock:
    #       cidr: 172.17.0.0/16
    #       except:
    #       - 172.17.1.0/24
    #   - namespaceSelector:
    #       matchLabels:
    #         project: myproject
    #   - podSelector:
    #       matchLabels:
    #         role: frontend
    #   ports:
    #   - protocol: TCP
    #     port: 6379
    # -- Egress rules for the NetworkPolicy object.
    # @section -- Analysis_worker
    egress: []
    # - to:
    #   - ipBlock:
    #       cidr: 10.0.0.0/24
    #   ports:
    #   - protocol: TCP
    #     port: 32000
    #     endPort: 32768
  metrics:
    # -- Deploy metrics service.
    # @section -- Analysis_worker
    enabled: false
    service:
      # -- Type of metrics service to create.
      # @section -- Analysis_worker
      type: "ClusterIP"
      # -- Metrics service annotations.
      # @section -- Analysis_worker
      annotations: {}
      # -- Metrics service labels.
      # @section -- Analysis_worker
      labels: {}
      # -- Metrics service port name.
      # @section -- Analysis_worker
      portName: "metrics"
      # -- Metrics service port.
      # @section -- Analysis_worker
      port: 9000
      # -- Metrics service target port.
      # @section -- Analysis_worker
      targetPort: 9000
    serviceMonitor:
      # -- Enable a prometheus ServiceMonitor.
      # @section -- Analysis_worker
      enabled: false
      # -- Prometheus ServiceMonitor labels.
      # @section -- Analysis_worker
      labels: {}
      # -- Prometheus ServiceMonitor annotations.
      # @section -- Analysis_worker
      annotations: {}
      endpoints:
        - basicAuth:
            # -- The secret in the service monitor namespace that contains the username for authentication.
            # @section -- Analysis_worker
            username: ""
            # -- The secret in the service monitor namespace that contains the password for authentication.
            # @section -- Analysis_worker
            password: ""
          bearerTokenSecret:
            # -- Secret name to mount to read bearer token for scraping targets. The secret needs to be in the same namespace as the service monitor and accessible by the Prometheus Operator.
            # @section -- Analysis_worker
            name: ""
            # -- Secret key to mount to read bearer token for scraping targets. The secret needs to be in the same namespace as the service monitor and accessible by the Prometheus Operator.
            # @section -- Analysis_worker
            key: ""
          # -- Prometheus ServiceMonitor interval.
          # @section -- Analysis_worker
          interval: "30s"
          # -- Prometheus ServiceMonitor scrapeTimeout. If empty, Prometheus uses the global scrape timeout unless it is less than the target's scrape interval value in which the latter is used.
          # @section -- Analysis_worker
          scrapeTimeout: "10s"
          # -- Path used by the Prometheus ServiceMonitor to scrape metrics.
          # @section -- Analysis_worker
          path: "/metrics"
          # -- When true, honorLabels preserves the metric’s labels when they collide with the target’s labels.
          # @section -- Analysis_worker
          honorLabels: false
          # -- Prometheus RelabelConfigs to apply to samples before scraping.
          # @section -- Analysis_worker
          relabelings: []
          # -- Prometheus MetricRelabelConfigs to apply to samples before ingestion.
          # @section -- Analysis_worker
          metricRelabelings: []
          # -- Prometheus ServiceMonitor selector.
          # @section -- Analysis_worker
          selector: {}
          # prometheus: kube-prometheus
          # -- Prometheus ServiceMonitor scheme.
          # @section -- Analysis_worker
          scheme: ""
          # -- Prometheus ServiceMonitor tlsConfig.
          # @section -- Analysis_worker
          tlsConfig: {}

# -- Bundled Redis (sessions of the backend and Celery broker). Off by default: point `REDIS_URL` at an
# existing Redis instead. See the `redis` dependency in Chart.yaml for its own values.
# @section -- Dependencies
redis:
  enabled: false
# -- Bundled PostgreSQL. Off by default: point `DATABASE_URL` at an existing database instead.
# @section -- Dependencies
postgres:
  enabled: false
# -- Bundled RustFS (S3-compatible object storage). Off by default: point `AWS_ENDPOINT_URL_S3` at an
# existing S3 instead.
# @section -- Dependencies
rustfs:
  enabled: false
