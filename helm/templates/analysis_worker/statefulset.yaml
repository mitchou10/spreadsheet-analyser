{{- if .Values.enabled }}
{{- if eq .Values.analysis_worker.deploymentType "StatefulSet" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "analysis_worker") }}
  labels: {{- include "helper.labels" (dict "root" . "componentName" "analysis_worker") | nindent 4 }}
spec:
  {{- if not .Values.analysis_worker.autoscaling.enabled }}
  replicas: {{ .Values.analysis_worker.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.analysis_worker.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "analysis_worker") | nindent 6 }}
  serviceName: {{ include "helper.componentFullname" (dict "root" . "componentName" "analysis_worker") }}
  {{- with .Values.analysis_worker.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "analysis_worker" "component" .Values.analysis_worker) | nindent 4 }}
  {{- if or .Values.analysis_worker.volumeClaims .Values.analysis_worker.extraVolumeClaims }}
  volumeClaimTemplates: {{- toYaml (concat (default (list) .Values.analysis_worker.volumeClaims) (default (list) .Values.analysis_worker.extraVolumeClaims)) | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
