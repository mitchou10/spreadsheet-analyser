{{- if .Values.enabled }}
{{- if and .Values.analysis_worker.serviceAccount.enabled .Values.analysis_worker.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.analysis_worker.serviceAccount.name | default (include "helper.componentFullname" (dict "root" . "componentName" "analysis_worker")) }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "analysis_worker")) | nindent 4 }}
  {{- if .Values.analysis_worker.serviceAccount.annotations }}
  annotations:
    {{- tpl (toYaml .Values.analysis_worker.serviceAccount.annotations) . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.analysis_worker.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
