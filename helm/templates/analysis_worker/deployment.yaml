{{- if .Values.enabled }}
{{- if eq .Values.analysis_worker.deploymentType "Deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "analysis_worker") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "analysis_worker")) | nindent 4 }}
spec:
  {{- if not .Values.analysis_worker.autoscaling.enabled }}
  replicas: {{ .Values.analysis_worker.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.analysis_worker.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "analysis_worker") | nindent 6 }}
  strategy:
    type: {{ .Values.analysis_worker.strategy.type }}
    {{- if eq .Values.analysis_worker.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.analysis_worker.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.analysis_worker.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "analysis_worker" "component" .Values.analysis_worker) | nindent 4 }}
{{- end }}
{{- end }}
