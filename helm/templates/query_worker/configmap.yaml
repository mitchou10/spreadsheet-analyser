{{- if .Values.enabled }}
{{- if or .Values.query_worker.envCm .Values.global.envCm -}}
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "query_worker") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "query_worker")) | nindent 4 }}
data:
  {{- if .Values.global.envCm -}}
  {{- include "helper.env" (dict "root" . "data" .Values.global.envCm) | indent 2 }}
  {{- end -}}
  {{- if .Values.query_worker.envCm -}}
  {{- include "helper.env" (dict "root" . "data" .Values.query_worker.envCm) | indent 2 }}
  {{- end -}}
{{- end -}}
{{- end }}
