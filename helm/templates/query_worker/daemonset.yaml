{{- if .Values.enabled }}
{{- if eq .Values.query_worker.deploymentType "DaemonSet" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "query_worker") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "query_worker")) | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.query_worker.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "query_worker") | nindent 6 }}
  {{- with .Values.query_worker.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "query_worker" "component" .Values.query_worker) | nindent 4 }}
{{- end }}
{{- end }}
