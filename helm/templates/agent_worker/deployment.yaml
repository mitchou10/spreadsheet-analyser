{{- if .Values.enabled }}
{{- if eq .Values.agent_worker.deploymentType "Deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "agent_worker") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "agent_worker")) | nindent 4 }}
spec:
  {{- if not .Values.agent_worker.autoscaling.enabled }}
  replicas: {{ .Values.agent_worker.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.agent_worker.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "agent_worker") | nindent 6 }}
  strategy:
    type: {{ .Values.agent_worker.strategy.type }}
    {{- if eq .Values.agent_worker.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.agent_worker.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.agent_worker.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "agent_worker" "component" .Values.agent_worker) | nindent 4 }}
{{- end }}
{{- end }}
