# Deployment values shared by every environment, same layout as Muffin's `values/common-values.yaml`.
# `values.yaml` only holds the chart's defaults and documentation: what is specific to this application
# (which Secrets each component loads, plain configuration, the migration job, the Vault objects that
# create those Secrets) lives here. Layer an environment file on top:
#
#   helm upgrade --install spreadsheet-analyser ./helm \
#     -f helm/values/common-values.yaml -f values-<env>.yaml
#
# What an environment file must set: the hostnames/URLs below, `global.vaultMount`
# (the Vault KV v2 mount, e.g. exploration) and `global.vaultEnv` (dev, staging, prod...: the first level of every
# path, `<vaultEnv>/spreadsheet-analyser/<secret>`), the `vaultAuthRef` if it differs, and the hosts in the DATABASE_URL / REDIS_URL templates. See helm/SECRETS.md for the secrets themselves.
#
# `{{ "{{" }} ... {{ "}}" }}` is how a Vault Secrets Operator template is written inside a Helm value:
# `extraObjects` is rendered with `tpl`, so the escaped braces come out as `{{ ... }}` for the operator.

# Fixed resource names (`spreadsheet-analyser-backend`, `...-agent-worker`...), independent of the release
# name: the workers reach the backend by its Service name below, and `env` values are not templated.
fullnameOverride: "spreadsheet-analyser"

global:
  # Where the Vault Secrets Operator reads the secrets: KV v2 mount `vaultMount`, path
  # `<vaultEnv>/spreadsheet-analyser/<secret>`. Defaults; an environment file overrides `vaultEnv`.
  vaultMount: "exploration"
  vaultEnv: "dev"
  # One Ingress for the whole application, like Muffin: `/api` goes to the backend, everything else to the frontend.
  # The host (and `tls`) belong to the environment file; `whitelist` (a list of CIDRs, from the shared
  # `ipwhitelist.yaml`) restricts the source addresses, any address when it is empty.
  ingress:
    enabled: true
    # The cluster's ingress controller (every other Mirai application sets it): without a class no controller
    # takes the Ingress over, and the host answers 404.
    className: "mirai-nginx"
    annotations:
      monitor: enabled
      nginx.ingress.kubernetes.io/whitelist-source-range: '{{ .Values.whitelist | join "," | default "0.0.0.0/0" }}'
      k8s.apisix.apache.org/allowlist-source-range: '{{ .Values.whitelist | join "," | default "0.0.0.0/0" }}'
    hosts:
      - name: "spreadsheet-analyser.example.org"
        paths:
          - path: "/api"
            pathType: "Prefix"
            backend:
              serviceName: "spreadsheet-analyser-backend"
              portNumber: 80
          - path: "/"
            pathType: "Prefix"
            backend:
              serviceName: "spreadsheet-analyser-frontend"
              portNumber: 80

backend:
  # Listed last: for a variable defined in several sources, the last one wins, so the computed secrets
  # (DATABASE_URL, REDIS_URL) cannot be shadowed by a stray key of another secret.
  envFrom:
    - secretRef:
        name: "spreadsheet-analyser-s3"
    - secretRef:
        name: "spreadsheet-analyser-keycloak"
    - secretRef:
        name: "spreadsheet-analyser-openai"
    - secretRef:
        name: "spreadsheet-analyser-internal"
    - secretRef:
        name: "spreadsheet-analyser-redis"
    - secretRef:
        name: "spreadsheet-analyser-db"
  # Plain (non-secret) app config - see backend/app/config/*.py for the full settings contract.
  env:
    KEYCLOAK_URL: "https://keycloak.example.org"
    KEYCLOAK_REALM: "mirai"
    KEYCLOAK_CLIENT_ID: "spreadsheet-analyser-backend"
    BACKEND_PUBLIC_URL: "https://spreadsheet-analyser.example.org"
    FRONTEND_URL: "https://spreadsheet-analyser.example.org"
    SESSION_COOKIE_SECURE: "true"
    AWS_ENDPOINT_URL_S3: "https://s3.fr-par.scw.cloud"
    AWS_S3_BUCKET: "spreadsheet-analyser"
    # First level of every object key: the same value in the backend, the agent worker and the index worker.
    S3_KEY_PREFIX: "spreadsheet-analyser"
    AWS_REGION: "fr-par"
    OPENAI_BASE_URL: ""
    LLM_ALLOWED_MODELS: ""

# Answers chat messages (LangGraph: plan, then answer, searching the analyses). Consumes the `agent` queue.
agent_worker:
  envFrom:
    - secretRef:
        name: "spreadsheet-analyser-s3"
    - secretRef:
        name: "spreadsheet-analyser-openai"
    - secretRef:
        name: "spreadsheet-analyser-internal"
    - secretRef:
        name: "spreadsheet-analyser-redis"
  env:
    BACKEND_URL: "http://spreadsheet-analyser-backend"
    AWS_ENDPOINT_URL_S3: "https://s3.fr-par.scw.cloud"
    AWS_S3_BUCKET: "spreadsheet-analyser"
    # First level of every object key: the same value in the backend, the agent worker and the index worker.
    S3_KEY_PREFIX: "spreadsheet-analyser"
    AWS_REGION: "fr-par"
    OPENAI_BASE_URL: ""

# Profiles the spreadsheets (csv, xlsx, xls, ods). Consumes the `analysis` queue. Never needs the LLM key.
analysis_worker:
  envFrom:
    - secretRef:
        name: "spreadsheet-analyser-s3"
    - secretRef:
        name: "spreadsheet-analyser-internal"
    - secretRef:
        name: "spreadsheet-analyser-redis"
  env:
    BACKEND_URL: "http://spreadsheet-analyser-backend"
    AWS_ENDPOINT_URL_S3: "https://s3.fr-par.scw.cloud"
    AWS_S3_BUCKET: "spreadsheet-analyser"
    AWS_REGION: "fr-par"
  # A spreadsheet is streamed (memory stays flat) but this is the ceiling: a pathological file can only
  # ever cost this pod. The image also recycles a Celery child that grows past ~600 MB.
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      memory: "1Gi"
  # The file is downloaded to /tmp before it is analysed (the root filesystem is read-only): cap that scratch space.
  volumes:
    - name: "tmp"
      emptyDir:
        sizeLimit: "2Gi"

# Keeps the BM25 search indexes (of each collection and of each person) up to date. Consumes the `index` queue.
# It reads analyses and indexes in S3 and asks the backend who can read what; it never needs the LLM key.
index_worker:
  envFrom:
    - secretRef:
        name: "spreadsheet-analyser-s3"
    - secretRef:
        name: "spreadsheet-analyser-internal"
    - secretRef:
        name: "spreadsheet-analyser-redis"
  env:
    BACKEND_URL: "http://spreadsheet-analyser-backend"
    AWS_ENDPOINT_URL_S3: "https://s3.fr-par.scw.cloud"
    AWS_S3_BUCKET: "spreadsheet-analyser"
    # First level of every object key: the same value in the backend, the agent worker and the index worker.
    S3_KEY_PREFIX: "spreadsheet-analyser"
    AWS_REGION: "fr-par"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      memory: "1Gi"

# Runs the SQL the agent writes over the real rows of the files (DuckDB, sandboxed). Same image as `analysis_worker`
# (the Parquet copies of the sheets are written by the analysis), own queue and own pods: a person waiting for an
# answer never queues behind the analysis of a large file. It never needs the LLM key.
query_worker:
  command:
    - "celery"
    - "-A"
    - "app.celery_app"
    - "worker"
    - "--loglevel=info"
    - "-Q"
    - "query"
    - "--concurrency=2"
    # A child that grows past ~1.2 GB is recycled after its task (the query itself is capped by QUERY_MEMORY_LIMIT).
    - "--max-memory-per-child=1200000"
  envFrom:
    - secretRef:
        name: "spreadsheet-analyser-s3"
    - secretRef:
        name: "spreadsheet-analyser-internal"
    - secretRef:
        name: "spreadsheet-analyser-redis"
  env:
    BACKEND_URL: "http://spreadsheet-analyser-backend"
    AWS_ENDPOINT_URL_S3: "https://s3.fr-par.scw.cloud"
    AWS_S3_BUCKET: "spreadsheet-analyser"
    AWS_REGION: "fr-par"
    # Per query: memory DuckDB may use before spilling to disk, time allowed, rows given back.
    QUERY_MEMORY_LIMIT: "512MB"
    QUERY_TIMEOUT_SECONDS: "30"
    QUERY_MAX_ROWS: "200"
    # The same worker draws the charts of the answers (PNG written to S3, served by the backend).
    CHART_MAX_POINTS: "5000"
  # CPU is what this worker is for: let a query use two cores (DuckDB runs QUERY_THREADS threads, 2 by default).
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
  # The Parquet files of a query are downloaded to /tmp (the root filesystem is read-only) and DuckDB spills there
  # when a query does not fit in memory: cap that scratch space.
  volumes:
    - name: "tmp"
      emptyDir:
        sizeLimit: "4Gi"

jobs:
  # Applies the database migrations. A post-install/post-upgrade hook, so the Secrets created by the Vault
  # Secrets Operator already exist when it runs (a pre-install hook would run before them).
  migration:
    hook:
      enabled: true
      types:
        - "post-install"
        - "post-upgrade"
      weight: 0
      deletePolicy: "before-hook-creation,hook-succeeded"
    image:
      registry: "ghcr.io"
      repository: "mitchou10/spreadsheet-analyser/backend"
      pullPolicy: "IfNotPresent"
      # Empty: the chart's appVersion, so the migration always matches the deployed backend.
      tag: ""
    command: ["alembic", "upgrade", "head"]
    envFrom:
      - secretRef:
          name: "spreadsheet-analyser-db"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: "RuntimeDefault"
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      capabilities:
        drop: ["ALL"]
    backoffLimit: 3

extraObjects:
  # Vault keys: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
  spreadsheet-analyser-s3:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: spreadsheet-analyser-s3
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ required "global.vaultMount is required (exploration...)" .Values.global.vaultMount }}'
      type: kv-v2
      path: '{{ required "global.vaultEnv is required (dev, staging, prod...)" .Values.global.vaultEnv }}/spreadsheet-analyser/s3'
      refreshAfter: 60s
      rolloutRestartTargets:
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "backend") }}'
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "agent_worker") }}'
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "analysis_worker") }}'
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "index_worker") }}'
      destination:
        name: spreadsheet-analyser-s3
        create: true

  # Vault key: KEYCLOAK_CLIENT_SECRET (the secret of the backend's client in Keycloak)
  spreadsheet-analyser-keycloak:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: spreadsheet-analyser-keycloak
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ required "global.vaultMount is required (exploration...)" .Values.global.vaultMount }}'
      type: kv-v2
      path: '{{ required "global.vaultEnv is required (dev, staging, prod...)" .Values.global.vaultEnv }}/spreadsheet-analyser/keycloak'
      refreshAfter: 60s
      rolloutRestartTargets:
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "backend") }}'
      destination:
        name: spreadsheet-analyser-keycloak
        create: true

  # Vault key: OPENAI_API_KEY
  spreadsheet-analyser-openai:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: spreadsheet-analyser-openai
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ required "global.vaultMount is required (exploration...)" .Values.global.vaultMount }}'
      type: kv-v2
      path: '{{ required "global.vaultEnv is required (dev, staging, prod...)" .Values.global.vaultEnv }}/spreadsheet-analyser/openai'
      refreshAfter: 60s
      rolloutRestartTargets:
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "backend") }}'
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "agent_worker") }}'
      destination:
        name: spreadsheet-analyser-openai
        create: true

  # Vault key: INTERNAL_API_TOKEN. One secret for every component, so the backend and both workers can
  # never disagree on its value.
  spreadsheet-analyser-internal:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: spreadsheet-analyser-internal
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ required "global.vaultMount is required (exploration...)" .Values.global.vaultMount }}'
      type: kv-v2
      path: '{{ required "global.vaultEnv is required (dev, staging, prod...)" .Values.global.vaultEnv }}/spreadsheet-analyser/internal'
      refreshAfter: 60s
      rolloutRestartTargets:
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "backend") }}'
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "agent_worker") }}'
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "analysis_worker") }}'
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "index_worker") }}'
      destination:
        name: spreadsheet-analyser-internal
        create: true

  # Vault key: REDIS_PASSWORD. REDIS_URL is computed so the password is stored once (the raw value is
  # kept in the Secret too). Assumes the password has no URL-reserved characters (VSO templates cannot
  # URL-encode): use an alphanumeric one.
  spreadsheet-analyser-redis:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: spreadsheet-analyser-redis
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ required "global.vaultMount is required (exploration...)" .Values.global.vaultMount }}'
      type: kv-v2
      path: '{{ required "global.vaultEnv is required (dev, staging, prod...)" .Values.global.vaultEnv }}/spreadsheet-analyser/redis'
      refreshAfter: 60s
      rolloutRestartTargets:
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "backend") }}'
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "agent_worker") }}'
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "analysis_worker") }}'
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "index_worker") }}'
      destination:
        name: spreadsheet-analyser-redis
        create: true
        transformation:
          templates:
            REDIS_URL:
              text: 'redis://:{{ "{{" }} get .Secrets "REDIS_PASSWORD" {{ "}}" }}@spreadsheet-analyser-redis:6379/0'

  # Same Vault path as `spreadsheet-analyser-db`: the owner CNPG creates with `initdb`. CNPG requires a
  # kubernetes.io/basic-auth Secret (keys username + password): with an Opaque one (the VSO default) the
  # Cluster waits forever.
  spreadsheet-analyser-db-appuser:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: spreadsheet-analyser-db-appuser
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ required "global.vaultMount is required (exploration...)" .Values.global.vaultMount }}'
      type: kv-v2
      path: '{{ required "global.vaultEnv is required (dev, staging, prod...)" .Values.global.vaultEnv }}/spreadsheet-analyser/db'
      refreshAfter: 60s
      destination:
        name: spreadsheet-analyser-db-appuser
        create: true
        type: kubernetes.io/basic-auth

  # Vault keys: username, password (the application's database user, also the owner of the CNPG database:
  # see `spreadsheet-analyser-db-appuser`). The host is the read-write Service of the CNPG cluster
  # (`cnpg.fullnameOverride` + `-rw`). Only DATABASE_URL reaches the pods:
  # `excludes` drops the raw username/password. The driver MUST be postgresql+asyncpg (backend/app/config/
  # database.py). Same assumption on URL-reserved characters as above.
  spreadsheet-analyser-db:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: spreadsheet-analyser-db
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ required "global.vaultMount is required (exploration...)" .Values.global.vaultMount }}'
      type: kv-v2
      path: '{{ required "global.vaultEnv is required (dev, staging, prod...)" .Values.global.vaultEnv }}/spreadsheet-analyser/db'
      refreshAfter: 60s
      rolloutRestartTargets:
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "backend") }}'
      destination:
        name: spreadsheet-analyser-db
        create: true
        transformation:
          excludes:
            - ".*"
          templates:
            DATABASE_URL:
              text: 'postgresql+asyncpg://{{ "{{" }} get .Secrets "username" {{ "}}" }}:{{ "{{" }} get .Secrets "password" {{ "}}" }}@spreadsheet-analyser-pg-cluster-rw:5432/spreadsheet_analyser'

# PostgreSQL is run by CloudNativePG (the `cnpg` cluster below), not by the bundled chart. The object storage is
# external: nothing is self-hosted for it.
# Redis (sessions of the backend and Celery queues) is the bundled chart, like Muffin; its Service is
# `<fullnameOverride>` (host of REDIS_URL, see `spreadsheet-analyser-redis`).
redis:
  enabled: true
  fullnameOverride: "spreadsheet-analyser-redis"
  architecture: "standalone"
  auth:
    existingSecret: "spreadsheet-analyser-redis"
    existingSecretPasswordKey: "REDIS_PASSWORD"
  # The generated redis.conf has no `dir`, so redis writes in / and the read-only root filesystem makes the RDB
  # snapshots fail (MISCONF): point it at the persistent volume.
  config:
    content: |
      # Redis configuration
      bind * -::*
      dir /data
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

postgres:
  enabled: false

rustfs:
  enabled: false

cnpg:
  enabled: true
  # The read-write Service is `<fullnameOverride>-rw`: it is the host of DATABASE_URL (`spreadsheet-analyser-db`).
  fullnameOverride: "spreadsheet-analyser-pg-cluster"
  mode: "standalone"
  cluster:
    imageName: "ghcr.io/cloudnative-pg/postgresql:17.7"
    instances: 1
    # The chart's defaults (8Gi, no separate WAL volume): a storage cannot shrink, and the WAL volume cannot be
    # added, once the cluster exists.
    storage:
      size: "8Gi"
    # Required by the namespace quota (`dso-quota`): CNPG applies it to every pod of the cluster, including the
    # `initdb` job and its `bootstrap-controller` container.
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
    initdb:
      database: "spreadsheet_analyser"
      owner: "spreadsheet_analyser"
      secret:
        name: "spreadsheet-analyser-db-appuser"
    monitoring:
      enabled: true
