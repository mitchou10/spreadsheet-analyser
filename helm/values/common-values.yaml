# Deployment values shared by every environment, same layout as Muffin's `values/common-values.yaml`.
# `values.yaml` only holds the chart's defaults and documentation: what is specific to this application
# (which Secrets each component loads, plain configuration, the migration job, the Vault objects that
# create those Secrets) lives here. Layer an environment file on top:
#
#   helm upgrade --install spreadsheet-analyser ./helm \
#     -f helm/values/common-values.yaml -f values-<env>.yaml
#
# What an environment file must set: the hostnames/URLs below, the `mount`/`path`/`vaultAuthRef` of each
# VaultStaticSecret (the KV v2 engine and where the secrets live in it) and the hosts in the
# DATABASE_URL / REDIS_URL templates. See helm/SECRETS.md for the secrets themselves.
#
# `{{ "{{" }} ... {{ "}}" }}` is how a Vault Secrets Operator template is written inside a Helm value:
# `extraObjects` is rendered with `tpl`, so the escaped braces come out as `{{ ... }}` for the operator.

# Fixed resource names (`spreadsheet-analyser-backend`, `...-agent-worker`...), independent of the release
# name: the workers reach the backend by its Service name below, and `env` values are not templated.
fullnameOverride: "spreadsheet-analyser"

backend:
  # Listed last: for a variable defined in several sources, the last one wins, so the computed secrets
  # (DATABASE_URL, REDIS_URL) cannot be shadowed by a stray key of another secret.
  envFrom:
    - secretRef:
        name: "spreadsheet-analyser-s3"
    - secretRef:
        name: "spreadsheet-analyser-keycloak"
    - secretRef:
        name: "spreadsheet-analyser-openai"
    - secretRef:
        name: "spreadsheet-analyser-internal"
    - secretRef:
        name: "spreadsheet-analyser-redis"
    - secretRef:
        name: "spreadsheet-analyser-db"
  # Plain (non-secret) app config - see backend/app/config/*.py for the full settings contract.
  env:
    KEYCLOAK_URL: "https://keycloak.example.org"
    KEYCLOAK_REALM: "spreadsheet-analyser"
    KEYCLOAK_CLIENT_ID: "spreadsheet-analyser-backend"
    BACKEND_PUBLIC_URL: "https://spreadsheet-analyser.example.org"
    FRONTEND_URL: "https://spreadsheet-analyser.example.org"
    SESSION_COOKIE_SECURE: "true"
    AWS_ENDPOINT_URL_S3: "https://s3.example.org"
    AWS_S3_BUCKET: "spreadsheet-analyser"
    AWS_REGION: "us-east-1"
    OPENAI_BASE_URL: ""
    LLM_DEFAULT_MODEL: "gpt-4o"
    LLM_ALLOWED_MODELS: ""

# Answers chat messages (LangGraph: plan, then answer, searching the analyses). Consumes the `agent` queue.
agent_worker:
  envFrom:
    - secretRef:
        name: "spreadsheet-analyser-s3"
    - secretRef:
        name: "spreadsheet-analyser-openai"
    - secretRef:
        name: "spreadsheet-analyser-internal"
    - secretRef:
        name: "spreadsheet-analyser-redis"
  env:
    BACKEND_URL: "http://spreadsheet-analyser-backend"
    AWS_ENDPOINT_URL_S3: "https://s3.example.org"
    AWS_S3_BUCKET: "spreadsheet-analyser"
    AWS_REGION: "us-east-1"
    OPENAI_BASE_URL: ""
    LLM_DEFAULT_MODEL: "gpt-4o"

# Profiles the spreadsheets (csv, xlsx, xls, ods). Consumes the `analysis` queue. Never needs the LLM key.
analysis_worker:
  envFrom:
    - secretRef:
        name: "spreadsheet-analyser-s3"
    - secretRef:
        name: "spreadsheet-analyser-internal"
    - secretRef:
        name: "spreadsheet-analyser-redis"
  env:
    BACKEND_URL: "http://spreadsheet-analyser-backend"
    AWS_ENDPOINT_URL_S3: "https://s3.example.org"
    AWS_S3_BUCKET: "spreadsheet-analyser"
    AWS_REGION: "us-east-1"
  # A spreadsheet is streamed (memory stays flat) but this is the ceiling: a pathological file can only
  # ever cost this pod. The image also recycles a Celery child that grows past ~600 MB.
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      memory: "1Gi"
  # The file is downloaded to /tmp before it is analysed (the root filesystem is read-only): cap that scratch space.
  volumes:
    - name: "tmp"
      emptyDir:
        sizeLimit: "2Gi"

jobs:
  # Applies the database migrations. A post-install/post-upgrade hook, so the Secrets created by the Vault
  # Secrets Operator already exist when it runs (a pre-install hook would run before them).
  migration:
    hook:
      enabled: true
      types:
        - "post-install"
        - "post-upgrade"
      weight: 0
      deletePolicy: "before-hook-creation,hook-succeeded"
    image:
      registry: "ghcr.io"
      repository: "mitchou10/spreadsheet-analyser/backend"
      pullPolicy: "IfNotPresent"
      # Empty: the chart's appVersion, so the migration always matches the deployed backend.
      tag: ""
    command: ["alembic", "upgrade", "head"]
    envFrom:
      - secretRef:
          name: "spreadsheet-analyser-db"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: "RuntimeDefault"
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      capabilities:
        drop: ["ALL"]
    backoffLimit: 3

extraObjects:
  # Vault keys: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
  spreadsheet-analyser-s3:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: spreadsheet-analyser-s3
    spec:
      vaultAuthRef: vault-auth
      mount: kv
      type: kv-v2
      path: spreadsheet-analyser/s3
      refreshAfter: 60s
      rolloutRestartTargets:
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "backend") }}'
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "agent_worker") }}'
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "analysis_worker") }}'
      destination:
        name: spreadsheet-analyser-s3
        create: true

  # Vault key: KEYCLOAK_CLIENT_SECRET (the secret of the backend's client in Keycloak)
  spreadsheet-analyser-keycloak:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: spreadsheet-analyser-keycloak
    spec:
      vaultAuthRef: vault-auth
      mount: kv
      type: kv-v2
      path: spreadsheet-analyser/keycloak
      refreshAfter: 60s
      rolloutRestartTargets:
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "backend") }}'
      destination:
        name: spreadsheet-analyser-keycloak
        create: true

  # Vault key: OPENAI_API_KEY
  spreadsheet-analyser-openai:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: spreadsheet-analyser-openai
    spec:
      vaultAuthRef: vault-auth
      mount: kv
      type: kv-v2
      path: spreadsheet-analyser/openai
      refreshAfter: 60s
      rolloutRestartTargets:
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "backend") }}'
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "agent_worker") }}'
      destination:
        name: spreadsheet-analyser-openai
        create: true

  # Vault key: INTERNAL_API_TOKEN. One secret for every component, so the backend and both workers can
  # never disagree on its value.
  spreadsheet-analyser-internal:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: spreadsheet-analyser-internal
    spec:
      vaultAuthRef: vault-auth
      mount: kv
      type: kv-v2
      path: spreadsheet-analyser/internal
      refreshAfter: 60s
      rolloutRestartTargets:
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "backend") }}'
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "agent_worker") }}'
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "analysis_worker") }}'
      destination:
        name: spreadsheet-analyser-internal
        create: true

  # Vault key: REDIS_PASSWORD. REDIS_URL is computed so the password is stored once (the raw value is
  # kept in the Secret too). Assumes the password has no URL-reserved characters (VSO templates cannot
  # URL-encode): use an alphanumeric one.
  spreadsheet-analyser-redis:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: spreadsheet-analyser-redis
    spec:
      vaultAuthRef: vault-auth
      mount: kv
      type: kv-v2
      path: spreadsheet-analyser/redis
      refreshAfter: 60s
      rolloutRestartTargets:
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "backend") }}'
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "agent_worker") }}'
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "analysis_worker") }}'
      destination:
        name: spreadsheet-analyser-redis
        create: true
        transformation:
          templates:
            REDIS_URL:
              text: 'redis://:{{ "{{" }} get .Secrets "REDIS_PASSWORD" {{ "}}" }}@redis.example.svc:6379/0'

  # Vault keys: username, password (the application's database user). Only DATABASE_URL reaches the pods:
  # `excludes` drops the raw username/password. The driver MUST be postgresql+asyncpg (backend/app/config/
  # database.py). Same assumption on URL-reserved characters as above.
  spreadsheet-analyser-db:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: spreadsheet-analyser-db
    spec:
      vaultAuthRef: vault-auth
      mount: kv
      type: kv-v2
      path: spreadsheet-analyser/db
      refreshAfter: 60s
      rolloutRestartTargets:
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "backend") }}'
      destination:
        name: spreadsheet-analyser-db
        create: true
        transformation:
          excludes:
            - ".*"
          templates:
            DATABASE_URL:
              text: 'postgresql+asyncpg://{{ "{{" }} get .Secrets "username" {{ "}}" }}:{{ "{{" }} get .Secrets "password" {{ "}}" }}@postgres.example.svc:5432/spreadsheet_analyser'
