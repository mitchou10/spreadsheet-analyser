services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spreadsheet_analyser
      POSTGRES_PASSWORD: spreadsheet_analyser
      POSTGRES_DB: spreadsheet_analyser
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: backend
      target: runtime
    environment:
      DATABASE_URL: postgresql+asyncpg://spreadsheet_analyser:spreadsheet_analyser@postgres:5432/spreadsheet_analyser
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: worker
      target: runtime
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  frontend:
    build:
      context: frontend
      target: runtime
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
