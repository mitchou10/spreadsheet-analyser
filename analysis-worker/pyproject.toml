[project]
name = "analysis-worker"
version = "0.7.1"
description = "spreadsheet-analyser analysis worker: streaming statistical profile of csv, xlsx, xls and ods files"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.114",
    "celery>=5.4.0",
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pyarrow>=26.0.0",
    "redis>=5.2.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
test = [
    "pytest>=8.3.0",
    "ruff>=0.15.0",
    "xlwt>=1.3.0",
]
dev = [{ include-group = "test" }]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
