[project]
name = "agent-worker"
version = "0.10.0"
description = "spreadsheet-analyser agent worker: answers chat messages (LangGraph plan then answer, searching the analyses)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.114",
    "celery>=5.4.0",
    "httpx>=0.28.1",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "redis>=5.2.0",
]

[dependency-groups]
test = [
    "pytest>=8.3.0",
    "ruff>=0.15.0",
]
dev = [{ include-group = "test" }]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
