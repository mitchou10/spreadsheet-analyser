[project]
name = "index-worker"
version = "0.5.0-rc.1"
description = "spreadsheet-analyser index worker: keeps the BM25 search indexes of the collections and of the users up to date"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.114",
    "celery>=5.4.0",
    "httpx>=0.28.1",
    "redis>=5.2.0",
]

[dependency-groups]
test = [
    "pytest>=8.3.0",
    "ruff>=0.15.0",
]
dev = [{ include-group = "test" }]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
