server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime configuration written at container start (docker/40-runtime-config.sh). Never cached: it changes
    # with the Helm values, not with the image.
    location = /config.js {
        alias /tmp/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    # Single-page app: let the client-side router own non-file paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
