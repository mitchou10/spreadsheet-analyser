[project]
name = "backend"
version = "0.6.1"
description = "spreadsheet-analyser backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "uvicorn[standard]>=0.54.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "asyncpg>=0.32.0",
    "alembic>=1.20.0",
    "redis>=8.1.0",
    "python-keycloak>=7.1.1",
    "aioboto3>=15.5.0",
    "python-multipart>=0.0.32",
    "celery>=5.6.3",
    "openai>=3.33.0",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-dotenv>=0.5.2",
    "httpx>=0.28.0",
    "ruff>=0.15.0",
]
dev = [{ include-group = "test" }, "eralchemy2>=1.4.1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
env_files = ["tests/.env.testing"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
